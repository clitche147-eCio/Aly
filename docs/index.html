<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aly - Welcome</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            max-width: 600px;
            text-align: center;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 2.5em;
        }
        
        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
            line-height: 1.6;
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        a {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .btn-primary {
            background: #667eea;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .features {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid #f0f0f0;
            text-align: left;
        }
        
        .feature-item {
            margin: 15px 0;
            color: #666;
        }
        
        .feature-item strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Welcome to Aly</h1>
        <p>Your web application is now live and ready to use!</p>
        
        <div class="buttons">
            <a href="./web-app/index.html" class="btn-primary">Launch Web App</a>
            <a href="https://github.com/clitche147-eCio/Aly" class="btn-secondary">View on GitHub</a>
        </div>
        
        <div class="features">
            <h3 style="color: #667eea; margin-bottom: 15px;">✨ Features</h3>
            <div class="feature-item">✅ <strong>Index Page</strong> - Main landing page</div>
            <div class="feature-item">✅ <strong>Login</strong> - User authentication</div>
            <div class="feature-item">✅ <strong>Register</strong> - New user registration</div>
            <div class="feature-item">✅ <strong>Dashboard</strong> - User dashboard</div>
        </div>
    </div>
</body>
</html>
